global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/pscale.rules.yml

scrape_configs:
  # Pull path: scrape the exporter's /metrics endpoint directly.
  - job_name: powerscale
    metrics_path: /metrics
    static_configs:
      - targets: ["pscale_exporter:9444"]

  # OTLP push path: scrape the OpenTelemetry collector, which re-exposes the metrics
  # the exporter pushes to it (only produces series when opentelemetry.metrics is
  # enabled in config.yaml). Lets the test stack observe both export paths.
  - job_name: powerscale-otlp
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # cee-exporter, the CEPA audit consumer. It runs in the cee-worker compose
  # project, so it is on a different Docker network and cannot be reached by
  # service name from here — hence the host address and published port rather
  # than "cee-exporter:9228". Connecting the two networks would work too, but
  # this keeps the two stacks independent.
  - job_name: cee-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["10.26.1.221:9228"]
